system:
  name: Agentic RAG Log Analyzer
  version: 1.0.0
  random_seed: 42
input:
  supported_formats:
  - txt
  - log
  - json
  batch_size: 1000
  stream_mode: false
preprocessing:
  log_parser: drain3
  drain3:
    depth: 4
    similarity_threshold: 0.4
    max_children: 100
  normalization:
    timestamp_format: '%Y-%m-%d %H:%M:%S'
    extract_severity: true
    extract_component: true
knowledge_base:
  storage_path: data/knowledge_base
  vector_store: faiss
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_dimension: 384
  chunk_size: 512
  chunk_overlap: 50
retrieval:
  top_k: 5
  similarity_threshold: 0.7
  retrieval_strategy: hybrid
  rerank: true
llm:
  # Default: Groq Cloud + Llama-3.1-8B-Instant.
  # Free tier (~14,400 req/day) is sufficient for full HDFS+BGL evaluation.
  # Set GROQ_API_KEY in your .env (get one free: https://console.groq.com/keys).
  # To switch back to local Ollama, set provider=ollama and model=mistral:7b-instruct.
  provider: groq
  model: llama-3.1-8b-instant
  temperature: 0.1
  max_tokens: 2048
  timeout: 60
  base_url: http://localhost:11434
  openai:
    api_key: ''
    base_url: https://api.openai.com
  anthropic:
    api_key: ''
    base_url: https://api.anthropic.com
    version: '2023-06-01'
  gemini:
    api_key: ''
    base_url: https://generativelanguage.googleapis.com
  groq:
    api_key: ''
    base_url: https://api.groq.com/openai
agentic:
  max_reasoning_steps: 5
  reasoning_strategy: react
  enable_self_reflection: false
  confidence_threshold: 0.6
  fast_mode: true
  early_stop_on_low_severity: true
  skip_info_logs: true
  skip_warning_logs: true
  max_steps_fast: 1
  enable_template_cache: true
  batch_similar_logs: true
  only_analyze_errors: true
alerts:
  severity_levels:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW
  - INFO
  include_reasoning_chain: true
  include_source_attribution: true
  include_recommendations: true
baselines:
  rule_based:
    error_keywords:
    - ERROR
    - FATAL
    - CRITICAL
    - EXCEPTION
    - FAILED
    threshold: 1
  isolation_forest:
    contamination: 0.1
    n_estimators: 100
    max_samples: 256
    random_state: 42
  non_agentic_rag:
    top_k: 5
    single_pass: true
evaluation:
  metrics:
  - precision
  - recall
  - f1_score
  - false_positive_rate
  - false_negative_rate
  efficiency_metrics:
  - latency
  - memory_usage
  - throughput
  statistical_tests:
  - paired_t_test
  significance_level: 0.05
datasets:
  hdfs:
    path: data/datasets/hdfs
    train_split: 0.7
    test_split: 0.3
  bgl:
    path: data/datasets/bgl
    train_split: 0.7
    test_split: 0.3
network_capture:
  enabled: false
  interface: en0
  filter: tcp or udp or icmp
  auto_analyze: true
  store_raw_logs: true
  raw_logs_path: data/router_logs
logging:
  level: INFO
  log_file: logs/system.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
